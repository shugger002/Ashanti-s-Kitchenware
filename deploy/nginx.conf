# Place in /etc/nginx/sites-available/ashantisakitchenware.com
# then: ln -s /etc/nginx/sites-available/ashantisakitchenware.com /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name ashantisakitchenware.com www.ashantisakitchenware.com;
    return 301 https://ashantisakitchenware.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ashantisakitchenware.com;
    ssl_certificate     /etc/letsencrypt/live/ashantisakitchenware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashantisakitchenware.com/privkey.pem;
    return 301 https://ashantisakitchenware.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ashantisakitchenware.com;

    ssl_certificate     /etc/letsencrypt/live/ashantisakitchenware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashantisakitchenware.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
